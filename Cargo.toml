[package]
name = "taffy-pcd-editor"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["core"]

[dependencies]
taffy-pcd-core = { path = "core" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.16"
glam = "0.30"
bytemuck = "1.25"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
